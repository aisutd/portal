name: AIS Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-validation:
    name: PR validation
    runs-on: ubuntu-latest

    # ADD THIS ENV BLOCK HERE:
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure DATABASE_URL for Prisma (safe fallback for PRs)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL=postgresql://localhost:5432/postgres?schema=public" >> "$GITHUB_ENV"
          fi

          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "DATABASE_URL_UNPOOLED=postgresql://localhost:5432/postgres" >> "$GITHUB_ENV"
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Add unit tests here when you make them:
      # - name: Run tests
      #   run: npm test

      - name: Production build
        if: github.event_name == 'push'
        run: npm run build

  db-smoke:
    name: Database smoke check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Database Connectivity & Migration Status
        run: npx prisma migrate status
